<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <title>Sobre o Zappr</title>
  <style>
    :root {
      --bg: #202c33;
      --card-bg: #202c33;
      --input-bg: #111b21;
      --border: #2a3942;
      --whatsapp-green: #00a884;
      --whatsapp-green-hover: #06cf9c;
      --text-primary: #e9edef;
      --text-secondary: #8696a0;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font:
        13px system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      user-select: none;
      overflow: hidden;
      border-radius: 12px;
    }

    .modal-card {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .modal-header {
      padding: 14px 18px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      -webkit-app-region: drag;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-title-icon {
      color: var(--whatsapp-green);
      display: flex;
      align-items: center;
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-app-region: no-drag;
      transition:
        background-color 0.15s,
        color 0.15s;
    }

    .modal-close-btn:hover {
      background: #2a3942;
      color: var(--text-primary);
    }

    .modal-body {
      padding: 16px 18px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
    }

    .hero-section {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .app-logo {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .app-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
      user-select: none;
      -webkit-user-drag: none;
    }

    .app-title-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .app-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .version-tag {
      font-size: 11px;
      font-weight: 600;
      background: rgba(0, 168, 132, 0.15);
      color: var(--whatsapp-green);
      border: 1px solid rgba(0, 168, 132, 0.35);
      border-radius: 12px;
      padding: 1px 7px;
    }

    .app-desc {
      font-size: 12px;
      color: var(--text-secondary);
      margin: 0;
      line-height: 1.35;
    }

    .info-card {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .info-label {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .info-value {
      font-size: 12px;
      color: var(--text-primary);
      font-weight: 600;
      font-family:
        ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .repo-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
      color: var(--text-primary);
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition:
        background-color 0.15s,
        border-color 0.15s;
    }

    .repo-button:hover {
      background: #2a3942;
      border-color: #3b4a54;
    }

    .repo-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .repo-left svg {
      color: var(--text-secondary);
    }

    .repo-button:hover .repo-left svg {
      color: var(--text-primary);
    }

    .repo-arrow {
      color: var(--text-secondary);
    }

    .modal-footer {
      padding: 12px 18px;
      background: #182229;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .btn-primary {
      background: var(--whatsapp-green);
      color: #111b21;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 168, 132, 0.3);
      transition:
        background-color 0.15s,
        transform 0.1s;
    }

    .btn-primary:hover {
      background: var(--whatsapp-green-hover);
      transform: translateY(-1px);
    }
  </style>
</head>

<body>
  <div class="modal-card">
    <div class="modal-header">
      <h2 id="about-title" class="modal-title">
        <span class="modal-title-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
        </span>
        <span id="about-title-text">Sobre o Zappr</span>
      </h2>
      <button type="button" id="close-x-btn" class="modal-close-btn" aria-label="Fechar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="hero-section">
        <div class="app-logo">
          <img src="../../build/icon.png" alt="Zappr" class="app-logo-img" />
        </div>
        <div class="app-title-group">
          <div class="app-title-row">
            <span class="app-name">Zappr</span>
            <span id="app-version" class="version-tag">...</span>
          </div>
          <p id="app-desc" class="app-desc">
            Cliente desktop para WhatsApp Web com suporte a múltiplas sessões
            isoladas.
          </p>
        </div>
      </div>

      <div class="info-card">
        <div class="info-item">
          <span class="info-label">Electron</span>
          <span id="electron-ver" class="info-value">-</span>
        </div>
        <div class="info-item">
          <span class="info-label">Chromium</span>
          <span id="chrome-ver" class="info-value">-</span>
        </div>
        <div class="info-item">
          <span class="info-label">Node.js</span>
          <span id="node-ver" class="info-value">-</span>
        </div>
        <div class="info-item">
          <span id="platform-label" class="info-label">Plataforma</span>
          <span id="platform-ver" class="info-value">-</span>
        </div>
      </div>

      <button type="button" id="repo-btn" class="repo-button">
        <span class="repo-left">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd"
              d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
          </svg>
          <span id="repo-label">Repositório do projeto</span>
        </span>
        <svg class="repo-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </button>
    </div>

    <div class="modal-footer">
      <button type="button" id="close-btn" class="btn-primary">Fechar</button>
    </div>
  </div>

  <script src="../i18n/renderer-strings.js"></script>
  <script src="modal.js"></script>
</body>

</html>
